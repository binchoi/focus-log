name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: focus-log

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires Node >= 20.9
          node-version: 22
          cache: npm
          cache-dependency-path: focus-log/package-lock.json

      - run: npm ci

      # next build no longer runs linting in Next 16, so lint is its own gate.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Generate PWA icons
        run: npm run icons

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-log/package-lock.json

      - run: npm ci

      - name: Generate PWA icons
        run: npm run icons

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: focus-log/playwright-report/
          retention-days: 7
